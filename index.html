<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/progression.css">
    <link rel="stylesheet" href="./css/progress.css">
    <link rel="stylesheet" href="./css/skins.css">
    <link rel="stylesheet" href="./css/controls.css">
    <title>Balloon Game</title>
</head>
<body>
    <main id="main">
        <div id="background"></div>
        <div id="hud" class="hud" aria-live="polite"></div>
        <div id="level-indicator" class="hud-level"></div>
        <div id="level-banner" class="level-banner" role="status"></div>

        <section class="screen" data-screen="menu" aria-labelledby="menu-title">
            <h1 id="menu-title" class="screen-title" data-i18n="game.title"></h1>
            <button class="button" data-action="play" data-i18n="menu.play"></button>
            <fieldset id="difficulty-picker" class="difficulty-picker">
                <legend data-i18n="menu.difficulty"></legend>
            </fieldset>
            <button class="button" data-action="high-scores" data-i18n="progress.menu.highScores"></button>
            <button class="button" data-action="achievements" data-i18n="progress.menu.achievements"></button>
            <div class="player-setup" data-role="player-setup"></div>
            <button class="button" data-action="controls" data-i18n="controls.open"></button>
            <label class="field">
                <span data-i18n="menu.language"></span>
                <select id="language-picker" class="select"></select>
            </label>
        </section>

        <section class="screen" data-screen="controls" aria-labelledby="controls-title">
            <h2 id="controls-title" class="screen-title" data-i18n="controls.title"></h2>
            <div class="controls-grid" data-role="controls-grid"></div>
            <p class="controls-status" data-role="controls-status" role="status"></p>
            <button class="button" data-action="controls-reset" data-i18n="controls.reset"></button>
            <button class="button" data-action="controls-back" data-i18n="controls.back"></button>
        </section>

        <section class="screen" data-screen="pause" aria-labelledby="pause-title">
            <h2 id="pause-title" class="screen-title" data-i18n="pause.title"></h2>
            <button class="button" data-action="resume" data-i18n="pause.resume"></button>
            <button class="button" data-action="quit" data-i18n="pause.quit"></button>
        </section>

        <section class="screen" data-screen="game-over" aria-labelledby="game-over-title">
            <h2 id="game-over-title" class="screen-title" data-i18n="gameOver.title"></h2>
            <p class="new-record" data-role="new-record" data-i18n="progress.newRecord" hidden></p>
            <ol class="results" data-role="results"></ol>
            <p class="results-distance" data-role="distance"></p>
            <button class="button" data-action="play" data-i18n="gameOver.playAgain"></button>
            <button class="button" data-action="quit" data-i18n="pause.quit"></button>
        </section>

        <section class="screen" data-screen="high-scores" aria-labelledby="high-scores-title">
            <h2 id="high-scores-title" class="screen-title" data-i18n="progress.highScores.title"></h2>
            <div class="progress-panel">
                <ol class="high-scores" data-role="high-scores"></ol>
                <p class="progress-empty" data-role="high-scores-empty" data-i18n="progress.highScores.empty"></p>
                <h3 class="progress-subtitle" data-i18n="progress.stats.title"></h3>
                <ul class="progress-stats" data-role="progress-stats"></ul>
            </div>
            <button class="button" data-action="progress-back" data-i18n="progress.back"></button>
        </section>

        <section class="screen" data-screen="achievements" aria-labelledby="achievements-title">
            <h2 id="achievements-title" class="screen-title" data-i18n="progress.achievements.title"></h2>
            <p class="progress-summary" data-role="achievements-summary"></p>
            <div class="progress-panel">
                <ul class="achievements" data-role="achievements"></ul>
            </div>
            <button class="button" data-action="progress-back" data-i18n="progress.back"></button>
            <button class="button button--danger" data-action="progress-reset" data-i18n="progress.reset"></button>
            <div class="reset-confirm" data-role="progress-reset-confirm" role="group" aria-labelledby="reset-question" hidden>
                <p id="reset-question" class="reset-confirm__question" data-i18n="progress.reset.question"></p>
                <button class="button button--danger" data-action="progress-reset-confirm" data-i18n="progress.reset.confirm"></button>
                <button class="button" data-action="progress-reset-cancel" data-i18n="progress.reset.cancel"></button>
            </div>
        </section>
    </main>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
