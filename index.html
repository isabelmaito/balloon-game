<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Balloon Game</title>
</head>
<body>
    <main id="main">
        <div id="background"></div>
        <div id="hud" class="hud" aria-live="polite"></div>

        <section class="screen" data-screen="menu" aria-labelledby="menu-title">
            <h1 id="menu-title" class="screen-title" data-i18n="game.title"></h1>
            <button class="button" data-action="play" data-i18n="menu.play"></button>
            <label class="field">
                <span data-i18n="menu.language"></span>
                <select id="language-picker" class="select"></select>
            </label>
        </section>

        <section class="screen" data-screen="pause" aria-labelledby="pause-title">
            <h2 id="pause-title" class="screen-title" data-i18n="pause.title"></h2>
            <button class="button" data-action="resume" data-i18n="pause.resume"></button>
            <button class="button" data-action="quit" data-i18n="pause.quit"></button>
        </section>

        <section class="screen" data-screen="game-over" aria-labelledby="game-over-title">
            <h2 id="game-over-title" class="screen-title" data-i18n="gameOver.title"></h2>
            <ol class="results" data-role="results"></ol>
            <button class="button" data-action="play" data-i18n="gameOver.playAgain"></button>
            <button class="button" data-action="quit" data-i18n="pause.quit"></button>
        </section>
    </main>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
